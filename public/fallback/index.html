<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Ink &amp; Iron</title>
    <style>
      :root {
        color: #24221e;
        background: #f4f1e9;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        border-left: 2px solid #a65f38;
        padding: 1rem 1.25rem;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0.55rem 0 0;
        color: #6d685f;
        line-height: 1.5;
      }

      a {
        color: #874827;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ink &amp; Iron</h1>
      <p>
        This is the static deployment fallback. The command center is served
        from the application root.
        <a href="/">Open the workspace</a>.
      </p>
    </main>
  </body>
</html>
